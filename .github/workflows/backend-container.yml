name: Backend container validation

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-container:
    name: Build Spring Boot Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: finsight-banking-api:ci
